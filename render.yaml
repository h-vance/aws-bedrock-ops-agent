services:
  - type: web
    name: triage-copilot
    runtime: python
    repo: https://github.com/h-vance/aws-bedrock-ops-agent
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn assistant:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BEDROCK_MOCK
        value: "true"
      - key: LAB_BASE_URL
        value: "https://aws-bedrock-ops-agent.onrender.com"
      - key: CORS_ORIGINS
        value: "https://aws-bedrock-ops-agent.onrender.com,http://localhost:8080,http://127.0.0.1:8080"
      - key: MCP_ALLOWED_HOSTS
        value: "aws-bedrock-ops-agent.onrender.com,127.0.0.1:*,localhost:*,[::1]:*"
      - key: MCP_ALLOWED_ORIGINS
        value: "https://aws-bedrock-ops-agent.onrender.com,http://127.0.0.1:*,http://localhost:*,http://[::1]:*"
